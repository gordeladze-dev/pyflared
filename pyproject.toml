[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyflared"
version = "1.0.1"
description = "A lightweight Python wrapper around cloudflared for quick and named tunnels."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["pyflared"]